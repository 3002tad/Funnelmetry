apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce-connector
  namespace: realtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commerce-connector
  template:
    metadata:
      labels:
        app: commerce-connector
    spec:
      containers:
        - name: commerce-connector
          image: commerce-connector:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_URL
            - name: RABBITMQ_EXCHANGE
              value: commerce_events
            - name: RABBITMQ_QUEUE
              value: commerce_connector_queue
            - name: TRACKING_API_URL
              value: http://tracking-api:3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
