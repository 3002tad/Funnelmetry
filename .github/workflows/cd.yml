# CD — build & push app images to GitHub Container Registry (GHCR).
# Deploy to k3s: use workflow "CD k3s (self-hosted)" or pull images on your cluster.
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: tracking-api
            context: services/tracking-api
            build_args: ""
          - service: streaming-processor
            context: services/streaming-processor
            build_args: ""
          - service: dashboard-api
            context: services/dashboard-api
            build_args: ""
          - service: dashboard-ui
            context: clients/dashboard
            build_args: "VITE_DASHBOARD_API_URL="
          - service: commerce-backend
            context: services/commerce-backend
            build_args: ""
          - service: commerce-connector
            context: services/commerce-connector
            build_args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{ is_default_branch }}
            type=sha,prefix=
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  publish-summary:
    name: Image summary
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Print image URIs
        run: |
          OWNER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA="${{ github.sha }}"
          echo "## Published images (GHCR)" >> "$GITHUB_STEP_SUMMARY"
          for svc in tracking-api streaming-processor dashboard-api dashboard-ui commerce-backend commerce-connector; do
            echo "- \`ghcr.io/${OWNER_REPO}/${svc}:${SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Package visibility: repo **Settings → Packages** (public for demo, private for team)." >> "$GITHUB_STEP_SUMMARY"
