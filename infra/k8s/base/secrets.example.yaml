apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: realtime
type: Opaque
stringData:
  POSTGRES_DB: realtime
  POSTGRES_USER: app
  POSTGRES_PASSWORD: change-me
  JWT_SECRET: change-me-use-long-random-string
  DASHBOARD_ADMIN_EMAIL: admin@pipeline.local
  DASHBOARD_ADMIN_PASSWORD: admin123
  RABBITMQ_URL: amqp://app:app@rabbitmq:5672
  # Optional: OLLAMA_URL in secret overrides deployment default (http://ollama:11434)
