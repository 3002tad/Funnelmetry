# Private monitoring overlay for one isolated Swarm stack. No public ports.
version: '3.8'
services:
  prometheus:
    image: ${MONITORING_PROMETHEUS_IMAGE:?Pin Prometheus digest}
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=7d, --storage.tsdb.retention.size=1GB]
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    secrets:
      - source: metrics_token
        target: funnelmetry_metrics_token
    volumes:
      - prometheus-data:/prometheus
    networks: [data]
    read_only: true
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:9090/-/ready']
      interval: 15s
      timeout: 5s
      retries: 6
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.funnelmetry.stateful == true]
      restart_policy: {condition: any, delay: 5s}
      update_config: {parallelism: 1, order: stop-first, failure_action: rollback}
      resources:
        reservations: {cpus: '0.10', memory: 128M}
        limits: {cpus: '1.00', memory: 1G}

  grafana:
    image: ${MONITORING_GRAFANA_IMAGE:?Pin Grafana digest}
    environment:
      GF_SECURITY_ADMIN_USER: monitoring-admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yml
      - source: grafana_provider
        target: /etc/grafana/provisioning/dashboards/pipeline.yml
      - source: grafana_dashboard
        target: /etc/funnelmetry-dashboards/pipeline.json
    secrets:
      - source: grafana_admin_password
        target: grafana_admin_password
    volumes:
      - grafana-data:/var/lib/grafana
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 33554432
    networks: [data]
    read_only: true
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.funnelmetry.stateful == true]
      restart_policy: {condition: any, delay: 5s}
      update_config: {parallelism: 1, order: stop-first, failure_action: rollback}
      resources:
        reservations: {cpus: '0.10', memory: 128M}
        limits: {cpus: '1.00', memory: 512M}

configs:
  prometheus_config:
    file: ./observability/prometheus.yml.example
  grafana_datasource:
    file: ./observability/provisioning/datasources/prometheus.yml
  grafana_provider:
    file: ./observability/provisioning/dashboards/pipeline.yml
  grafana_dashboard:
    file: ../runtime/monitoring/swarm/pipeline.json
secrets:
  metrics_token:
    external: true
    name: ${SWARM_STACK_NAME:?Set isolated stack name}_metrics_token_v1
  grafana_admin_password:
    external: true
    name: ${SWARM_STACK_NAME:?Set isolated stack name}_grafana_admin_password_v1
volumes:
  prometheus-data:
  grafana-data:
