# Canonical cross-platform Pipeline stack. Use `node runtime/deploy.mjs start`
# for a fresh isolated deployment; the same Compose file also supports manual operation.
name: ${HANDOFF_PROJECT:?Set a unique HANDOFF_PROJECT}

x-database: &database
  POSTGRES_HOST: postgres
  POSTGRES_PORT: '5432'
  POSTGRES_DB: funnelmetry_handoff
  POSTGRES_USER: funnelmetry
  POSTGRES_PASSWORD: ${HANDOFF_DB_PASSWORD:?Set HANDOFF_DB_PASSWORD}
x-worker-env: &worker-env
  <<: *database
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC_RAW: funnelmetry.raw.v1
  KAFKA_TOPIC_INGRESS_RECEIPTS: funnelmetry.ingress.receipts.v1
  KAFKA_TOPIC_CANONICAL: funnelmetry.canonical.v1
  KAFKA_TOPIC_CANONICALIZATION_OUTCOMES: funnelmetry.canonicalization.outcomes.v1
  KAFKA_TOPIC_QUARANTINE: funnelmetry.quarantine.v1
  KAFKA_TOPIC_CANONICAL_PERSISTED: funnelmetry.canonical.persisted.v1
  KAFKA_TOPIC_JOURNEY_RESOLVED: funnelmetry.journey.resolved.v1
  KAFKA_TOPIC_FUNNEL_UPDATED: funnelmetry.funnel.updated.v1
  KAFKA_TOPIC_KPI_UPDATED: funnelmetry.kpi.updated.v1
x-api-image: &api-image
  image: ${HANDOFF_API_IMAGE:?Set a pinned API image or a local development tag}
  build:
    context: ..
    dockerfile: infra/docker/dashboard-api.Dockerfile
  pull_policy: ${HANDOFF_IMAGE_POLICY:-always}
x-web-image: &web-image
  image: ${HANDOFF_WEB_IMAGE:?Set a pinned Web image or a local development tag}
  build:
    context: ..
    dockerfile: infra/docker/dashboard-web.Dockerfile
  pull_policy: ${HANDOFF_IMAGE_POLICY:-always}
x-worker: &worker
  image: ${HANDOFF_WORKERS_IMAGE:?Set a pinned Workers image or a local development tag}
  build:
    context: ..
    dockerfile: infra/docker/pipeline-workers.Dockerfile
  pull_policy: ${HANDOFF_IMAGE_POLICY:-always}
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: 'on-failure:3'
  stop_grace_period: 45s
  depends_on:
    bootstrap: {condition: service_completed_successfully}
    kafka-topics: {condition: service_completed_successfully}

services:
  postgres:
    image: postgres:15-alpine
    environment: *database
    volumes: [handoff-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U funnelmetry -d funnelmetry_handoff']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes: [handoff-kafka:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  kafka-topics:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        for topic in raw canonical quarantine canonical.persisted journey.resolved funnel.updated kpi.updated; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --partitions 1 --replication-factor 1 --topic funnelmetry.$$topic.v1 --config cleanup.policy=delete
        done
        for topic in ingress.receipts canonicalization.outcomes; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --partitions 1 --replication-factor 1 --topic funnelmetry.$$topic.v1 --config cleanup.policy=compact
        done
  bootstrap:
    <<: *api-image
    environment:
      <<: *database
      HANDOFF_MODE: OFFLINE_DEMO
    command: [node, /workspace/infra/bootstrap/bootstrap-handoff.mjs]
    depends_on:
      postgres: {condition: service_healthy}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  analytical-releases:
    <<: *api-image
    environment:
      <<: *database
      PORT: '32000'
      JWT_SECRET: ${HANDOFF_JWT_SECRET:?Set HANDOFF_JWT_SECRET}
      JWT_EXPIRES: 8h
      CORS_ORIGIN_DASHBOARD: http://localhost:${HANDOFF_UI_PORT:-5181}
      DASHBOARD_ADMIN_EMAIL: ${HANDOFF_ADMIN_EMAIL:?Set HANDOFF_ADMIN_EMAIL}
      DASHBOARD_ADMIN_PASSWORD: ${HANDOFF_ADMIN_PASSWORD:?Set HANDOFF_ADMIN_PASSWORD}
    command:
      - node
      - --input-type=module
      - -e
      - |
        const { analyticalPool: pool } = await import('./src/db.js');
        try {
          const { installStagingOrderCatalog } = await import('/workspace/analytics/src/semantic-registry.mjs');
          const { installRankingCatalog } = await import('/workspace/analytics/src/order-ranking.mjs');
          const { installProductRankingCatalog } = await import('/workspace/analytics/src/product-ranking.mjs');
          await installStagingOrderCatalog(pool);
          await installRankingCatalog(pool);
          await installProductRankingCatalog(pool);
        } catch { console.error('Analytical release installation failed'); process.exitCode = 1; }
        finally { await pool.end(); }
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  dashboard-api:
    <<: *api-image
    environment:
      <<: *database
      PORT: '32000'
      JWT_SECRET: ${HANDOFF_JWT_SECRET:?Set HANDOFF_JWT_SECRET}
      JWT_EXPIRES: 8h
      CORS_ORIGIN_DASHBOARD: http://localhost:${HANDOFF_UI_PORT:-5181}
      DASHBOARD_ADMIN_EMAIL: ${HANDOFF_ADMIN_EMAIL:?Set HANDOFF_ADMIN_EMAIL}
      DASHBOARD_ADMIN_PASSWORD: ${HANDOFF_ADMIN_PASSWORD:?Set HANDOFF_ADMIN_PASSWORD}
      DASHBOARD_ENABLE_LEGACY: 'false'
      DASHBOARD_ENABLE_AI: 'false'
      DASHBOARD_ENABLE_QWEN: ${HANDOFF_ENABLE_QWEN:-false}
      DASHBOARD_ENABLE_POLARS: ${HANDOFF_ENABLE_POLARS:-false}
      DASHBOARD_ENABLE_ORDER_SUMMARY_STAGING: 'true'
      DASHBOARD_ENABLE_ORDER_CHAT_STAGING: 'true'
      DASHBOARD_ENABLE_ORDER_RANKING_STAGING: 'true'
      DASHBOARD_ENABLE_PRODUCT_RANKING_STAGING: 'true'
      DASHSCOPE_API_KEY: ${HANDOFF_DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${HANDOFF_DASHSCOPE_BASE_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_TIMEOUT_MS: '15000'
      DASHBOARD_WORKER_HEALTH_ENABLED: 'true'
      DASHBOARD_KAFKA_LAG_ENABLED: 'true'
      DASHBOARD_KAFKA_LAG_BROKERS: kafka:9092
      DASHBOARD_KAFKA_LAG_TARGETS_JSON: >-
        [{"group_id":"funnelmetry-canonical-normalizer-v1","topic":"funnelmetry.raw.v1"},
        {"group_id":"funnelmetry-canonical-ledger-v1","topic":"funnelmetry.canonical.v1"},
        {"group_id":"funnelmetry-ingress-telemetry-v1","topic":"funnelmetry.ingress.receipts.v1"},
        {"group_id":"funnelmetry-ingress-telemetry-v1","topic":"funnelmetry.canonicalization.outcomes.v1"},
        {"group_id":"funnelmetry-journey-processor-v1","topic":"funnelmetry.canonical.persisted.v1"},
        {"group_id":"funnelmetry-funnel-processor-v1","topic":"funnelmetry.journey.resolved.v1"},
        {"group_id":"funnelmetry-kpi-projector-v1","topic":"funnelmetry.funnel.updated.v1"}]
      DASHBOARD_PROMETHEUS_MONITORING_ENABLED: ${HANDOFF_MONITORING_ENABLED:-false}
      MONITORING_EXPIRY_WARNING_SECONDS: ${MONITORING_EXPIRY_WARNING_SECONDS:-86400}
      MONITORING_SCRAPE_STALE_SECONDS: ${MONITORING_SCRAPE_STALE_SECONDS:-120}
    depends_on:
      analytical-releases: {condition: service_completed_successfully}
      kafka-topics: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:32000/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 5s
      timeout: 3s
      retries: 30
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  dashboard-web:
    <<: *web-image
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    ports: ['127.0.0.1:${HANDOFF_UI_PORT:-5181}:8080']
    depends_on:
      dashboard-api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/healthz']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  canonical-normalizer:
    <<: *worker
    cpus: '${HANDOFF_NORMALIZER_CPUS:-1.0}'
    mem_limit: ${HANDOFF_NORMALIZER_MEMORY:-512m}
    pids_limit: ${HANDOFF_NORMALIZER_PIDS:-128}
    working_dir: /workspace/workers/canonical-normalizer
    environment:
      <<: *worker-env
      WORKER_HEALTH_PORT: '32110'
      CANONICAL_NORMALIZER_INSTANCE_ID: handoff-canonical-normalizer
      CANONICAL_NORMALIZER_MAPPING_CONFIG_PATH: /workspace/integrations/medusa/canonical-mappings.v1.json
  canonical-ledger-writer:
    <<: *worker
    cpus: '${HANDOFF_LEDGER_CPUS:-1.0}'
    mem_limit: ${HANDOFF_LEDGER_MEMORY:-512m}
    pids_limit: ${HANDOFF_LEDGER_PIDS:-128}
    working_dir: /workspace/workers/canonical-ledger-writer
    environment:
      <<: *worker-env
      WORKER_HEALTH_PORT: '32110'
      CANONICAL_LEDGER_INSTANCE_ID: handoff-canonical-ledger-writer
  ingress-telemetry-writer:
    <<: *worker
    cpus: '${HANDOFF_TELEMETRY_CPUS:-1.0}'
    mem_limit: ${HANDOFF_TELEMETRY_MEMORY:-512m}
    pids_limit: ${HANDOFF_TELEMETRY_PIDS:-128}
    working_dir: /workspace/workers/ingress-telemetry-writer
    environment:
      <<: *worker-env
      WORKER_HEALTH_PORT: '32110'
      INGRESS_TELEMETRY_INSTANCE_ID: handoff-ingress-telemetry-writer
  journey-processor:
    <<: *worker
    cpus: '${HANDOFF_JOURNEY_CPUS:-1.0}'
    mem_limit: ${HANDOFF_JOURNEY_MEMORY:-512m}
    pids_limit: ${HANDOFF_JOURNEY_PIDS:-128}
    working_dir: /workspace/workers/journey-processor
    environment:
      <<: *worker-env
      WORKER_HEALTH_PORT: '32110'
      JOURNEY_PROCESSOR_INSTANCE_ID: handoff-journey-processor
  funnel-processor:
    <<: *worker
    cpus: '${HANDOFF_FUNNEL_CPUS:-1.0}'
    mem_limit: ${HANDOFF_FUNNEL_MEMORY:-512m}
    pids_limit: ${HANDOFF_FUNNEL_PIDS:-128}
    working_dir: /workspace/workers/funnel-processor
    environment:
      <<: *worker-env
      WORKER_HEALTH_PORT: '32110'
      FUNNEL_PROCESSOR_INSTANCE_ID: handoff-funnel-processor
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      kafka-topics: {condition: service_completed_successfully}
      profile-publisher: {condition: service_completed_successfully}
  funnel-maturity-scheduler:
    <<: *worker
    cpus: '${HANDOFF_MATURITY_CPUS:-1.0}'
    mem_limit: ${HANDOFF_MATURITY_MEMORY:-512m}
    pids_limit: ${HANDOFF_MATURITY_PIDS:-128}
    working_dir: /workspace/workers/funnel-maturity-scheduler
    environment:
      <<: *database
      MATURITY_SCHEDULER_INSTANCE_ID: handoff-funnel-maturity-scheduler
      MATURITY_SCHEDULER_POLL_INTERVAL_MS: '5000'
      MATURITY_SCHEDULER_BATCH_SIZE: '100'
      MATURITY_SCHEDULER_FINALIZATION_ENABLED: 'false'
  kpi-projector:
    <<: *worker
    cpus: '${HANDOFF_KPI_CPUS:-1.0}'
    mem_limit: ${HANDOFF_KPI_MEMORY:-512m}
    pids_limit: ${HANDOFF_KPI_PIDS:-128}
    working_dir: /workspace/workers/kpi-projector
    environment:
      <<: *worker-env
      WORKER_HEALTH_PORT: '32110'
      KPI_PROJECTOR_INSTANCE_ID: handoff-kpi-projector
  profile-publisher:
    <<: *worker
    cpus: '${HANDOFF_PUBLISHER_CPUS:-1.0}'
    mem_limit: ${HANDOFF_PUBLISHER_MEMORY:-512m}
    pids_limit: ${HANDOFF_PUBLISHER_PIDS:-128}
    restart: 'no'
    working_dir: /workspace/workers/funnel-processor
    command: [node, src/publish-reference-profiles.js]
    environment:
      <<: *worker-env
      FUNNEL_PROCESSOR_INSTANCE_ID: handoff-publisher
      FUNNEL_PROFILE_SOURCE_ID: medusa-reference
  source-connector:
    <<: *worker
    profiles: [live]
    working_dir: /workspace/workers/source-connector
    command:
      - node
      - --input-type=module
      - -e
      - |
        if (process.env.HANDOFF_LIVE_ACK !== 'FRESH_PARALLEL_LIVE') throw Error('LIVE_REVIEW_REQUIRED');
        process.env.SOURCE_CONNECTOR_DATABASE_URL = 'postgresql://funnelmetry:' + encodeURIComponent(process.env.POSTGRES_PASSWORD) + '@postgres:5432/funnelmetry_handoff';
        await import('./src/main.js');
    environment:
      HANDOFF_LIVE_ACK: ${HANDOFF_LIVE_ACK:-}
      POSTGRES_PASSWORD: ${HANDOFF_DB_PASSWORD:?Set HANDOFF_DB_PASSWORD}
      SOURCE_CONNECTOR_MODE: NORMAL
      SOURCE_CONNECTOR_ID: ${HANDOFF_CONNECTOR_ID:-}
      SOURCE_EVENT_FEED_URL: ${HANDOFF_FEED_URL:-}
      SOURCE_EVENT_FEED_TOKEN: ${HANDOFF_FEED_TOKEN:-}
      SOURCE_EVENT_FEED_ID: ${HANDOFF_FEED_ID:-}
      SOURCE_INITIAL_AFTER_SEQ: ${HANDOFF_INITIAL_AFTER_SEQ:-}
      SOURCE_FEED_BATCH_SIZE: '100'
      SOURCE_FEED_WAIT_SECONDS: '25'
      SOURCE_FEED_TIMEOUT_MS: '35000'
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    stop_grace_period: 50s
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:32100/healthz").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 3
  catalog-sync:
    <<: *worker
    profiles: [catalog]
    working_dir: /workspace/workers/catalog-sync
    environment:
      <<: *database
      CATALOG_SOURCE_ID: medusa-reference
      CATALOG_MEDUSA_URL: ${HANDOFF_CATALOG_URL:-}
      CATALOG_MEDUSA_SECRET_KEY: ${HANDOFF_CATALOG_KEY:-}
      CATALOG_INTERVAL_MS: '3600000'
    stop_grace_period: 30s
  monitoring-schema:
    profiles: [monitoring]
    image: postgres:15-alpine
    environment:
      PGPASSWORD: ${HANDOFF_DB_PASSWORD:?Set HANDOFF_DB_PASSWORD}
    volumes:
      - ./postgres/011_monitoring_credentials.sql:/migration.sql:ro
    entrypoint: [psql, -h, postgres, -U, funnelmetry, -d, funnelmetry_handoff, -v, ON_ERROR_STOP=1, -f, /migration.sql]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: 'no'
  prometheus:
    profiles: [monitoring]
    image: ${MONITORING_PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0}
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=7d, --storage.tsdb.retention.size=1GB]
    volumes:
      - ./observability/prometheus.yml.example:/etc/prometheus/prometheus.yml:ro
      - monitoring-prometheus:/prometheus
    secrets: [funnelmetry_metrics_token]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:9090/-/ready']
      interval: 10s
      timeout: 3s
      retries: 12
  grafana:
    profiles: [monitoring]
    image: ${MONITORING_GRAFANA_IMAGE:-grafana/grafana:13.2.2}
    environment:
      GF_SECURITY_ADMIN_USER: monitoring-admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
    ports: ['127.0.0.1:${MONITORING_GRAFANA_PORT:-5182}:3000']
    volumes:
      - monitoring-grafana:/var/lib/grafana
      - ./observability/provisioning:/etc/grafana/provisioning:ro
      - ../runtime/monitoring/dashboards:/etc/funnelmetry-dashboards:ro
    secrets: [grafana_admin_password]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 3s
      retries: 12

secrets:
  funnelmetry_metrics_token:
    file: ../runtime/monitoring/metrics-token
  grafana_admin_password:
    file: ../runtime/monitoring/grafana-password
volumes:
  handoff-db:
  handoff-kafka:
  monitoring-prometheus:
  monitoring-grafana:
