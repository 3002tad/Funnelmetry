apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-demo-worker
  namespace: realtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-demo-worker
  template:
    metadata:
      labels:
        app: web-demo-worker
    spec:
      containers:
        - name: web-demo-worker
          image: web-demo-worker:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_URL
            - name: RABBITMQ_EXCHANGE
              value: ecommerce.events
            - name: RABBITMQ_EXCHANGE_TYPE
              value: topic
            - name: RABBITMQ_ORDER_QUEUE
              value: webdemo.order-processing
            - name: RABBITMQ_ORDER_BINDING_KEY
              value: order.created
            - name: WORKER_STEP_DELAY_MS
              value: "600"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
