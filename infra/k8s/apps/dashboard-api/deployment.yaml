apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-api
  namespace: realtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-api
  template:
    metadata:
      labels:
        app: dashboard-api
    spec:
      containers:
        - name: dashboard-api
          image: dashboard-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRES
              value: "7d"
            - name: DASHBOARD_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DASHBOARD_ADMIN_EMAIL
            - name: DASHBOARD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DASHBOARD_ADMIN_PASSWORD
            - name: CORS_ORIGIN_DASHBOARD
              value: http://localhost:8090,http://localhost:30809,http://127.0.0.1:8090,http://127.0.0.1:30809
            - name: QDRANT_URL
              value: http://qdrant:6333
            - name: QDRANT_COLLECTION
              value: pipeline_insights
            - name: PIPELINE_TRACKING_API_URL
              value: http://tracking-api:3000
            - name: PIPELINE_COMMERCE_BACKEND_URL
              value: http://commerce-backend:3000
            - name: PIPELINE_RABBITMQ_MGMT_URL
              value: http://rabbitmq:15672
            - name: RABBITMQ_MGMT_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_MGMT_PASS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_PASS
            # Ollama in-cluster (k3s). After deploy: kubectl exec -n realtime deploy/ollama -- ollama pull qwen2.5:3b
            - name: OLLAMA_URL
              value: http://ollama:11434
            - name: OLLAMA_MODEL
              value: qwen2.5:3b
            - name: OLLAMA_TIMEOUT_MS
              value: "30000"
            - name: OLLAMA_TEMPERATURE
              value: "0.65"
            - name: OLLAMA_NUM_PREDICT
              value: "768"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
