apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: realtime
data:
  000_init.sql: |
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
  001_tracking_schema.sql: |
    -- Tracking pipeline schema (from docs/Refactor_tracking_pipeline.md §6, §13)
    -- Applied after init.sql bootstrap. Wire into compose when ready.

    CREATE TABLE IF NOT EXISTS tracking_events_clean (
      event_id VARCHAR(100) PRIMARY KEY,
      event_time TIMESTAMP NOT NULL,
      event_source VARCHAR(80),
      event_category VARCHAR(50),
      event_type VARCHAR(80),
      anonymous_id VARCHAR(100),
      session_id VARCHAR(100),
      user_id VARCHAR(100),
      page_url TEXT,
      product_id VARCHAR(100),
      metadata JSONB,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS tracking_kpi_1m (
      window_start TIMESTAMP NOT NULL,
      window_end TIMESTAMP NOT NULL,
      total_events INT DEFAULT 0,
      page_views INT DEFAULT 0,
      product_views INT DEFAULT 0,
      clicks INT DEFAULT 0,
      searches INT DEFAULT 0,
      add_to_cart INT DEFAULT 0,
      checkout_start INT DEFAULT 0,
      purchases INT DEFAULT 0,
      revenue NUMERIC DEFAULT 0,
      unique_sessions INT DEFAULT 0,
      conversion_rate NUMERIC DEFAULT 0,
      processed_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      PRIMARY KEY (window_start)
    );

    CREATE TABLE IF NOT EXISTS product_kpi_1m (
      window_start TIMESTAMP NOT NULL,
      product_id VARCHAR(100) NOT NULL,
      product_views INT DEFAULT 0,
      add_to_cart INT DEFAULT 0,
      purchases INT DEFAULT 0,
      add_to_cart_rate NUMERIC DEFAULT 0,
      purchase_rate NUMERIC DEFAULT 0,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      PRIMARY KEY (window_start, product_id)
    );

    CREATE TABLE IF NOT EXISTS banner_kpi_1m (
      window_start TIMESTAMP NOT NULL,
      window_end TIMESTAMP NOT NULL,
      banner_id VARCHAR(120) NOT NULL,
      impressions INT DEFAULT 0,
      clicks INT DEFAULT 0,
      ctr NUMERIC DEFAULT 0,
      target_product_id VARCHAR(100),
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      PRIMARY KEY (window_start, banner_id)
    );

    CREATE TABLE IF NOT EXISTS product_revenue_kpi_1m (
      window_start TIMESTAMP NOT NULL,
      window_end TIMESTAMP NOT NULL,
      product_id VARCHAR(100) NOT NULL,
      views INT DEFAULT 0,
      clicks INT DEFAULT 0,
      add_to_cart INT DEFAULT 0,
      checkout_start INT DEFAULT 0,
      purchases INT DEFAULT 0,
      revenue NUMERIC DEFAULT 0,
      view_to_cart_rate NUMERIC DEFAULT 0,
      purchase_rate NUMERIC DEFAULT 0,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      PRIMARY KEY (window_start, product_id)
    );
  002_products_catalog.sql: |
    -- Product catalog for display purposes — seeded from demo-shop product list.
    -- Joined at query time by dashboard-api; not part of the streaming pipeline.

    CREATE TABLE IF NOT EXISTS products_catalog (
      product_id  VARCHAR(100) PRIMARY KEY,
      name        VARCHAR(255) NOT NULL,
      price       NUMERIC      NOT NULL DEFAULT 0,
      category    VARCHAR(100)
    );

    INSERT INTO products_catalog (product_id, name, price, category) VALUES
      ('P001', 'Áo thun basic',       199000, 'fashion'),
      ('P002', 'Giày sneaker',        890000, 'fashion'),
      ('P003', 'Tai nghe Bluetooth',  450000, 'electronics'),
      ('P004', 'Bình giữ nhiệt',      120000, 'home'),
      ('P005', 'Sách productivity',    85000, 'books'),
      ('P006', 'Chuột không dây',     320000, 'electronics')
    ON CONFLICT (product_id) DO UPDATE SET
      name     = EXCLUDED.name,
      price    = EXCLUDED.price,
      category = EXCLUDED.category;
  003_dashboard_users.sql: |
    CREATE TABLE IF NOT EXISTS dashboard_users (
      id            UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      email         VARCHAR(255) UNIQUE NOT NULL,
      password_hash VARCHAR(255) NOT NULL,
      display_name  VARCHAR(100),
      role          VARCHAR(20) NOT NULL DEFAULT 'viewer'
                    CHECK (role IN ('super_admin', 'analyst', 'viewer')),
      is_active     BOOLEAN NOT NULL DEFAULT true,
      last_login_at TIMESTAMP,
      created_at    TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
      updated_at    TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
    );

    CREATE INDEX IF NOT EXISTS idx_dashboard_users_email ON dashboard_users (email);
    CREATE INDEX IF NOT EXISTS idx_dashboard_users_role ON dashboard_users (role);
  004_tracking_kpi_revenue.sql: |
    -- Site-wide revenue per minute (every purchase_succeeded, with or without product_id).
    ALTER TABLE tracking_kpi_1m
      ADD COLUMN IF NOT EXISTS revenue NUMERIC NOT NULL DEFAULT 0;
