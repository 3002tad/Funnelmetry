# Optional local demo monitoring. No Docker socket, no public Prometheus port.
services:
  dashboard-api:
    environment:
      DASHBOARD_PROMETHEUS_MONITORING_ENABLED: 'true'
      MONITORING_EXPIRY_WARNING_SECONDS: ${MONITORING_EXPIRY_WARNING_SECONDS:-86400}
      MONITORING_SCRAPE_STALE_SECONDS: ${MONITORING_SCRAPE_STALE_SECONDS:-120}
  prometheus:
    image: ${MONITORING_PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0}
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=7d, --storage.tsdb.retention.size=1GB]
    volumes:
      - ./observability/prometheus.yml.example:/etc/prometheus/prometheus.yml:ro
      - monitoring-prometheus:/prometheus
    secrets: [funnelmetry_metrics_token]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:9090/-/ready']
      interval: 10s
      timeout: 3s
      retries: 12
  grafana:
    image: ${MONITORING_GRAFANA_IMAGE:?Set a pinned Grafana image}
    environment:
      GF_SECURITY_ADMIN_USER: monitoring-admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
    ports: ['127.0.0.1:${MONITORING_GRAFANA_PORT:-5182}:3000']
    volumes:
      - monitoring-grafana:/var/lib/grafana
      - ./observability/provisioning:/etc/grafana/provisioning:ro
      - ../runtime/monitoring/dashboards:/etc/funnelmetry-dashboards:ro
    secrets: [grafana_admin_password]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 3s
      retries: 12
secrets:
  funnelmetry_metrics_token:
    file: ../runtime/monitoring/metrics-token
  grafana_admin_password:
    file: ../runtime/monitoring/grafana-password
volumes:
  monitoring-prometheus:
  monitoring-grafana:
