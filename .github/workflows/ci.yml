# CI — validate manifests, build dashboard UI, build Docker images (no push).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  medusa-ci-installer:
    name: Medusa CI installer (plan-only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/medusa-ci-installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test

  kustomize:
    name: Kustomize (sprint3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate sprint3 manifest
        run: kubectl kustomize infra/k8s/sprint3 > /tmp/sprint3.yaml

  dashboard-api-chat:
    name: dashboard-api chat guards
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dashboard-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test
      - run: npm run test:eval

  dashboard-ui:
    name: Build dashboard UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: clients/dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_DASHBOARD_API_URL: ""

  docker-images:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: tracking-api
            context: services/tracking-api
            build_args: ""
          - service: streaming-processor
            context: services/streaming-processor
            build_args: ""
          - service: dashboard-api
            context: services/dashboard-api
            build_args: ""
          - service: dashboard-ui
            context: clients/dashboard
            build_args: "VITE_DASHBOARD_API_URL="
          - service: commerce-backend
            context: services/commerce-backend
            build_args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: ${{ matrix.service }}:ci
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
