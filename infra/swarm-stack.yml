# DEC-126 isolated data substrate; live mode requires a fresh stack and cursor.
# Render only with the Swarm deployment command; do not paste secrets into YAML.
version: '3.8'

x-stateful-deploy: &stateful-deploy
  replicas: 1
  placement:
    constraints:
      - node.labels.funnelmetry.stateful == true
  restart_policy:
    # Docker/Desktop shutdown can stop a task cleanly; stateful services must
    # still be rescheduled when the node becomes available again.
    condition: any
    delay: 5s
    max_attempts: 5
  update_config:
    parallelism: 1
    order: stop-first
    failure_action: pause

services:
  postgres:
    image: ${SWARM_POSTGRES_IMAGE:?Pin the PostgreSQL image digest}
    environment:
      POSTGRES_DB: funnelmetry_handoff
      POSTGRES_USER: funnelmetry
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - db-data:/var/lib/postgresql/data
    stop_grace_period: 60s
    networks:
      - data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U funnelmetry -d funnelmetry_handoff']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      <<: *stateful-deploy
      resources:
        reservations: {cpus: '0.50', memory: 512M}
        limits: {cpus: '2.00', memory: 2G}

  kafka:
    image: ${SWARM_KAFKA_IMAGE:?Pin the Kafka image digest}
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # Single-node KRaft must reach its controller before Swarm publishes a
      # healthy kafka service record in overlay DNS.
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
      - kafka-data:/var/lib/kafka/data
    stop_grace_period: 60s
    networks:
      - data
    healthcheck:
      # Kafka's admin CLI follows the advertised Swarm hostname, which is not
      # resolvable until this task is healthy. Probe the local socket instead.
      test: [CMD-SHELL, "bash -c 'echo > /dev/tcp/127.0.0.1/9092'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    deploy:
      <<: *stateful-deploy
      resources:
        reservations: {cpus: '1.00', memory: 1G}
        limits: {cpus: '2.00', memory: 2G}

  bootstrap:
    image: ${SWARM_API_IMAGE:?Pin the API image digest}
    command: [node, /workspace/infra/docker/swarm-entrypoint.mjs, /workspace/infra/bootstrap/bootstrap-swarm.mjs]
    environment:
      HANDOFF_MODE: ${SWARM_MIGRATION_MODE:?Set reviewed mode}
      SWARM_EXPECTED_SCHEMA_DIGEST: ${SWARM_EXPECTED_SCHEMA_DIGEST:?Set reviewed schema digest}
      POSTGRES_HOST: postgres
      POSTGRES_DB: funnelmetry_handoff
      POSTGRES_USER: funnelmetry
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    networks:
      - data
    read_only: true
    deploy:
      replicas: ${SWARM_BOOTSTRAP_REPLICAS:-1}
      placement:
        constraints:
          - node.labels.funnelmetry.stateful == true
      restart_policy: {condition: none}
      resources:
        reservations: {cpus: '0.25', memory: 128M}
        limits: {cpus: '1.00', memory: 512M}

  kafka-topics:
    image: ${SWARM_WORKERS_IMAGE:?Pin the Workers image digest}
    command: [node, /workspace/infra/docker/swarm-kafka-topics.mjs]
    environment:
      HANDOFF_MODE: ${SWARM_MIGRATION_MODE:?Set reviewed mode}
      # Historical process variable consumed by swarm-kafka-topics.mjs; operator input is SWARM_RAW_PARTITIONS.
      HANDOFF_RAW_PARTITIONS: ${SWARM_RAW_PARTITIONS:-1}
    networks:
      - data
    read_only: true
    deploy:
      replicas: ${SWARM_KAFKA_TOPICS_REPLICAS:-1}
      placement:
        constraints:
          - node.labels.funnelmetry.stateful == true
      restart_policy: {condition: none}
      resources:
        reservations: {cpus: '0.25', memory: 128M}
        limits: {cpus: '1.00', memory: 512M}

secrets:
  db_password:
    external: true
    name: ${SWARM_STACK_NAME:?Set isolated stack name}_db_password_v1

networks:
  data:
    driver: overlay

volumes:
  db-data:
  kafka-data:
