server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location = /healthz {
        access_log off;
        return 200 'ready';
        add_header Content-Type text/plain;
    }
    location /api/ {
        # Docker Compose may replace the API container with a new IP. Resolve at
        # request time through Docker DNS instead of pinning its startup IP.
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 2s;
        set $api_upstream dashboard-api:32000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
        # Do not write query strings/tokens to access logs.
        access_log off;
    }
    # `/assets` is an application route, while `/assets/*` contains Vite files.
    # Handle the exact route before nginx redirects the physical assets directory.
    location = /assets {
        try_files /index.html =404;
        add_header Cache-Control 'no-cache';
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control 'no-cache';
    }
}
