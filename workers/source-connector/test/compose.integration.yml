# Isolated disposable integration project: never use with demo/private overlays.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: connector_test
      POSTGRES_PASSWORD: connector_test
      POSTGRES_DB: connector_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U connector_test -d connector_test']
      interval: 2s
      retries: 30
  kafka:
    image: apache/kafka:3.9.1
    tmpfs: ['/tmp/connector-kafka:uid=1000,gid=1000,mode=0700']
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_LOG_DIRS: /tmp/connector-kafka
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1']
      interval: 3s
      timeout: 5s
      retries: 30
  test:
    image: node:22-bookworm-slim
    working_dir: /workspace/workers/source-connector
    volumes:
      - ../../..:/workspace:ro
    tmpfs:
      - /workspace/workers/source-connector/node_modules
      - /workspace/workers/canonical-normalizer/node_modules
      - /workspace/workers/canonical-ledger-writer/node_modules
    command: [sh, -c, 'npm ci --prefix ../canonical-normalizer --ignore-scripts --no-audit --no-fund && npm ci --prefix ../canonical-ledger-writer --ignore-scripts --no-audit --no-fund && npm ci --ignore-scripts --no-audit --no-fund && node test/integration.mjs']
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
