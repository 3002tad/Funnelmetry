# Isolated candidate: writes stage-2 context to versioned Pipeline-style tables
# in the clone's private projection DB. No live binding or published port.
services:
  inventory-price-governed-writer:
    build:
      context: ${CDC_CANDIDATE_WORKER_CONTEXT:-../..}
      dockerfile: workers/inventory-price-cdc-writer/Dockerfile.shadow
    env_file:
      - ./private/inventory-price-projector.env
      - ./private/inventory-price-governed-writer.env
    depends_on:
      inventory-price-projection-db: {condition: service_healthy}
      kafka: {condition: service_healthy}
    restart: on-failure
    networks: [shadow]
