name: CDC reference installer CI

on:
  push:
    branches:
      - feature/cdc-medusa-v1
    paths:
      - .github/workflows/cdc-reference-installer-ci.yml
      - tools/medusa-ci-installer/**
      - tools/medusa-reference-cdc-shadow/**
      - workers/catalog-cdc-writer/**
      - infra/postgres/v2/021_catalog_cdc_candidate.sql
      - infra/postgres/tests/catalog_cdc_candidate_quality.sql
      - apps/dashboard-api/src/lib/product-reference.js
      - apps/dashboard-api/test/product-reference.test.js
      - infra/docker/pipeline-workers.Dockerfile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check CDC installer Python syntax
        run: |
          python -m py_compile \
            tools/medusa-reference-cdc-shadow/install-reference.py \
            tools/medusa-reference-cdc-shadow/clone-db.py \
            tools/medusa-reference-cdc-shadow/prepare-private.py
      - name: Test CDC runtime installer guards
        run: python -m unittest discover -s tools/medusa-reference-cdc-shadow -p test_install_reference.py -v
      - name: Test catalog and inventory/price shadow profiles
        run: |
          python -m py_compile \
            tools/medusa-reference-cdc-shadow/install-catalog-shadow.py \
            tools/medusa-reference-cdc-shadow/install-inventory-price-shadow.py \
            tools/medusa-reference-cdc-shadow/prepare-inventory-price-private.py \
            tools/medusa-reference-cdc-shadow/prepare-inventory-price-projection-private.py \
            tools/medusa-reference-cdc-shadow/verify-inventory-price-snapshot.py \
            tools/medusa-reference-cdc-shadow/verify-inventory-price-projection.py \
            tools/medusa-reference-cdc-shadow/probe-inventory-price-shadow.py \
            tools/medusa-reference-cdc-shadow/probe-inventory-price-replay.py \
            tools/medusa-reference-cdc-shadow/probe-inventory-price-store-api.py
          python -m unittest discover -s tools/medusa-reference-cdc-shadow -p test_catalog_shadow.py -v
          python -m unittest discover -s tools/medusa-reference-cdc-shadow -p test_inventory_price_shadow.py -v
          node --check tools/medusa-reference-cdc-shadow/inventory-price-projector/main.mjs
      - name: Check CDC recovery syntax and semantic guards
        run: |
          python -m py_compile \
            tools/medusa-reference-cdc-shadow/verify-recovery-epoch.py \
            tools/medusa-reference-cdc-shadow/activate-recovery-baseline.py \
            tools/medusa-reference-cdc-shadow/probe-cdc10-snapshot-interrupt.py \
            tools/medusa-reference-cdc-shadow/probe-cdc10-second-slot-loss.py \
            tools/medusa-reference-cdc-shadow/probe-cdc10-sustained-recovery.py
          python -m unittest discover -s tools/medusa-reference-cdc-shadow -p test_recovery_epoch.py -v
          node --check tools/medusa-reference-cdc-shadow/reference-recovery-mapper/main.mjs
          node --check tools/medusa-reference-cdc-shadow/reference-recovery-analytics/main.mjs
      - name: Test Medusa CI planner
        run: npm test --prefix tools/medusa-ci-installer
      - name: Test governed catalog CDC candidate
        run: |
          python -m py_compile \
            tools/medusa-reference-cdc-shadow/verify-catalog-governed-candidate.py \
            tools/medusa-reference-cdc-shadow/probe-catalog-governed-candidate.py \
            tools/medusa-reference-cdc-shadow/prepare-catalog-governed-private.py \
            tools/medusa-reference-cdc-shadow/publish-catalog-governed-quality.py
          npm ci --prefix workers/catalog-cdc-writer --ignore-scripts
          npm test --prefix workers/catalog-cdc-writer
          node --test apps/dashboard-api/test/product-reference.test.js
      - name: Build candidate Workers image
        run: docker build --file infra/docker/pipeline-workers.Dockerfile --tag funnelmetry-workers-cdc-ci .
