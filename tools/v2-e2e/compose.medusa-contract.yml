services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: medusa_contract_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: isolated-test-only
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d medusa_contract_test"]
      interval: 2s
      timeout: 2s
      retries: 30
