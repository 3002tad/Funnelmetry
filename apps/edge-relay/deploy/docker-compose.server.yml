name: funnelmetry_source_ingress

services:
  source-ingress:
    build:
      context: ../../..
      dockerfile: infra/docker/node-service.Dockerfile
      args:
        SERVICE_PATH: apps/edge-relay
    restart: unless-stopped
    env_file:
      - path: ./source-ingress.server.env
        required: true
    ports:
      - "127.0.0.1:32000:32000"
    volumes:
      - source-event-log-data:/var/lib/funnelmetry-source-event-log
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:32000/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  source-event-log-data:
