      containers:
        - name: generator-ui
          image: ghcr.io/3002tad/realtime-generator-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5174
          readinessProbe:
            httpGet:
              path: /
              port: 5174
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5174
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-conf
          configMap:
            name: generator-ui-nginx-conf
