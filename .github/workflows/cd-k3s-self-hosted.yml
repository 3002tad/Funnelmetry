# CD k3s — deploy on your WSL machine (self-hosted runner with label `k3s`).
# Setup: docs/CI_CD.md § Self-hosted runner
name: "CD k3s (self-hosted)"

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: cd-k3s-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, import, rollout (k3s)
    runs-on: [self-hosted, Linux, k3s]
    steps:
      - uses: actions/checkout@v4

      - name: Build and import images
        run: bash infra/k8s/import-images.sh

      - name: Apply manifests
        run: k3s kubectl apply -k infra/k8s/sprint3

      - name: Restart app deployments
        run: |
          NS=realtime
          for dep in tracking-api streaming-processor dashboard-api dashboard-ui \
            commerce-backend; do
            k3s kubectl -n "$NS" rollout restart "deploy/${dep}" 2>/dev/null || true
          done

      - name: Wait for rollouts
        run: |
          k3s kubectl -n realtime rollout status deploy/dashboard-api --timeout=180s
          k3s kubectl -n realtime rollout status deploy/tracking-api --timeout=180s

      - name: Smoke health
        run: |
          curl -sf http://127.0.0.1:31000/health
          curl -sf -o /dev/null -w "%{http_code}" http://127.0.0.1:30809/ | grep -qE '200|304'
