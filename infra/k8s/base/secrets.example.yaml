apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: realtime
type: Opaque
stringData:
  POSTGRES_DB: realtime
  POSTGRES_USER: app
  POSTGRES_PASSWORD: change-me
  JWT_SECRET: change-me-use-long-random-string
  DASHBOARD_ADMIN_EMAIL: admin@gmail.com
  DASHBOARD_ADMIN_PASSWORD: admin@123
  RABBITMQ_URL: amqp://app:app@rabbitmq:5672
  TRACKING_INGEST_API_KEY: demo-ingest-key-change-me
  # Optional: OLLAMA_URL in secret overrides deployment default (http://ollama:11434)
