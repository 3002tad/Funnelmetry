apiVersion: funnelmetry.io/v2
kind: InputIntegration

host:
  type: medusa-v2-dtc-starter
  medusa_version: 2.19.0

source:
  id: medusa-reference

ingest:
  # The browser needs a public URL; the backend may use an internal URL.
  browser_url: https://funnelmetry.example.com/v1/ingress/events
  backend_url: https://funnelmetry.example.com/v1/ingress/events

auth:
  source_key_id: medusa-reference-dev
  browser_write_key_ref: FUNNELMETRY_BROWSER_WRITE_KEY
  backend_signing_key_ref: FUNNELMETRY_BACKEND_SIGNING_KEY

bindings:
  browser:
    - behavior.product_viewed
    - checkout.started
  storefront_server:
    - behavior.search_submitted
    - cart.item_added
  medusa_backend:
    - medusa.order_placed

reliability:
  failure_mode: fail_open
  timeout_ms: 800
  max_queue_size: 200
  retry:
    max_attempts: 3
  circuit_breaker:
    failure_threshold: 3
    cooldown_ms: 30000
