name: Two-path acquisition CI

on:
  push:
    branches: [main, feature/two-path-acquisition]
    paths:
      - .github/workflows/cdc-reference-installer-ci.yml
      - tools/ci/**
      - tools/medusa-ci-installer/**
      - packages/behavior-event-catalog/**
      - packages/browser-sdk/**
      - apps/edge-relay/**
      - integrations/medusa/**
      - workers/canonical-normalizer/**
      - workers/cart-line-item-cdc-mapper/**
      - workers/catalog-cdc-writer/**
      - workers/inventory-price-cdc-writer/**
      - workers/reference-order-cdc-v2-mapper/**
      - workers/reference-order-cdc-v2-sink/**
  pull_request:
    paths:
      - tools/ci/**
      - tools/medusa-ci-installer/**
      - packages/behavior-event-catalog/**
      - packages/browser-sdk/**
      - apps/edge-relay/**
      - integrations/medusa/**
      - workers/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-path-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/package-lock.json
      - name: Install package workspace
        run: npm ci --prefix packages --ignore-scripts
      - name: Enforce Backend Integration retirement
        run: node tools/ci/check-backend-integration-retired.mjs
      - name: Verify installer fresh and upgrade paths
        run: node --test tools/medusa-ci-installer/test/*.test.mjs
      - name: Verify Browser SDK and catalog
        run: |
          npm test --prefix packages/behavior-event-catalog
          npm test --prefix packages/browser-sdk
      - name: Verify HTTP retirement admission
        run: node --test apps/edge-relay/test/*.test.js
      - name: Verify canonical admission
        run: |
          npm ci --prefix workers/canonical-normalizer --ignore-scripts
          npm test --prefix workers/canonical-normalizer
      - name: Verify CDC cart/order/catalog projections
        run: |
          for worker in cart-line-item-cdc-mapper catalog-cdc-writer inventory-price-cdc-writer reference-order-cdc-v2-sink; do
            npm ci --prefix "workers/$worker" --ignore-scripts
            npm test --prefix "workers/$worker"
          done
          npm ci --prefix workers/reference-order-cdc-v2-mapper --ignore-scripts
          node --check workers/reference-order-cdc-v2-mapper/src/main.js
