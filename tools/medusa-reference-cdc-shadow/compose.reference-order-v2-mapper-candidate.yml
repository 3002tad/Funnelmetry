# Isolated candidate mapper with its own state DB and fact topic.
services:
  reference-order-v2-mapper-db:
    image: postgres:15-alpine
    env_file: ./private/reference-order-v2-mapper-db.env
    volumes:
      - reference-order-v2-mapper-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U reference_v2_mapper -d reference_v2_mapper"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [shadow]

  reference-order-v2-mapper:
    build:
      context: ${CDC_ORDER_MAPPER_CONTEXT:-../../workers/reference-order-cdc-v2-mapper}
      dockerfile: Dockerfile.shadow
    env_file: ./private/reference-order-v2-mapper.env
    depends_on:
      reference-order-v2-mapper-db: {condition: service_healthy}
      kafka: {condition: service_healthy}
    restart: on-failure
    networks: [shadow]

volumes:
  reference-order-v2-mapper-data:
