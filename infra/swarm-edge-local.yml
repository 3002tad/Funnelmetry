# Local/internal hostname with a separately trusted certificate in Swarm secrets.
version: '3.8'
services:
  edge:
    image: ${SWARM_TRAEFIK_IMAGE:?Pin the Traefik image digest}
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entryPoints.websecure.address=:443
      - --api.dashboard=false
    environment:
      SWARM_PUBLIC_DOMAIN: ${SWARM_PUBLIC_DOMAIN:?Set local hostname}
    configs:
      - source: edge_dynamic_local
        target: /etc/traefik/dynamic.yml
    secrets:
      - tls_cert
      - tls_key
    ports:
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    networks: [data]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.funnelmetry.edge == true]
      restart_policy: {condition: any, delay: 5s}
      update_config: {parallelism: 1, order: stop-first, failure_action: rollback}
      resources:
        reservations: {cpus: '0.10', memory: 64M}
        limits: {cpus: '0.50', memory: 256M}
configs:
  edge_dynamic_local:
    file: ./swarm/traefik-local.yml
secrets:
  tls_cert:
    external: true
    name: ${SWARM_STACK_NAME:?Set isolated stack name}_tls_cert_v1
  tls_key:
    external: true
    name: ${SWARM_STACK_NAME:?Set isolated stack name}_tls_key_v1
